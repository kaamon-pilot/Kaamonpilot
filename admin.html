<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaamgar Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe4;--card:#fffdf7;--ink:#2b2420;--mut:#7a6d62;--brick:#b5452b;--turm:#e0a31b;--line:#d9cfbc;--ok:#3f7d4e}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#27211d;--ink:#f1e9da;--mut:#a89a8a;--brick:#e0674a;--turm:#e8b43a;--line:#41382f;--ok:#6bb57c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "IBM Plex Mono",monospace}
.w{max-width:560px;margin:0 auto;padding:16px}h1{font-size:18px;margin:0 0 12px}h1 span{color:var(--brick)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px dashed var(--line);padding:8px;text-align:center}.st b{display:block;font-size:20px}.st small{color:var(--mut)}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.f button{padding:6px 10px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit}
.f button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px dashed var(--line);border-left:5px solid var(--turm);padding:10px;margin:8px 0;word-break:break-word}
.card.done,.card.approved{border-left-color:var(--ok)}.card.cancelled,.card.blocked{border-left-color:var(--mut);opacity:.7}
.tag{font-size:11px;padding:1px 7px;border:1px solid var(--ink);margin-left:6px}
.a{display:flex;gap:6px;margin-top:8px}.a button{flex:1;padding:8px;border:0;background:var(--ink);color:var(--bg);font:inherit}
.a .r{background:var(--brick);color:#fff}.a .g{background:var(--ok);color:#fff}
a{color:var(--brick)}.empty{color:var(--mut);text-align:center;padding:20px}.big{padding:12px;border:0;background:var(--brick);color:#fff;font:inherit;font-weight:600;width:100%}
</style></head><body><div class="w">
<h1>Kaamgar<span>.</span> Admin</h1><div id="main"><div class="empty">Loading...</div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,updateDoc,deleteDoc,doc,onSnapshot,query,orderBy,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ADMIN="rizwankousar2011@gmail.com";
const firebaseConfig={apiKey:"AIzaSyAhlOUnba7MfRQIFlif60qsUkkZHnQS6Rc",authDomain:"kaamon-pilot.firebaseapp.com",projectId:"kaamon-pilot",storageBucket:"kaamon-pilot.firebasestorage.app",messagingSenderId:"463694330185",appId:"1:463694330185:web:2a445f304195f4cd8f4298"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let tab="users",flt="all",users=[],shifts=[],unsubs=[],err="";const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"\u20b9"+Number(n).toLocaleString("en-IN");
const NAMES={open:"OPEN",full:"FULL",done:"COMPLETED",cancelled:"CANCELLED"};
const okMap=u=>/^https:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|www\.google\.com\/maps|google\.com\/maps|maps\.google\.com)(\/|\?|$)/.test(u||"");
const slotsOf=s=>Object.entries(s.slots||{}).map(([uid,v])=>({uid,...v}));
function stat(s){if(s.status=="cancelled")return "cancelled";if(!s.needed)return s.status||"open";const L=slotsOf(s);if(L.length&&L.filter(w=>w.status=="done").length>=s.needed)return "done";if(L.length>=s.needed)return "full";return "open"}

function draw(){
 const u=auth.currentUser;
 if(!u){$("main").innerHTML='<button class="big" id="login">Sign in with Google</button>'+(err?'<p>'+esc(err)+'</p>':"");return}
 if((u.email||"").toLowerCase()!==ADMIN){$("main").innerHTML='<div class="empty">This account is not allowed here.</div><button class="big" id="out">Sign out</button>';return}
 const pend=users.filter(x=>x.status=="pending").length,openS=shifts.filter(s=>stat(s)=="open").length,act=shifts.filter(s=>stat(s)=="full").length,done=shifts.filter(s=>stat(s)=="done"),paid=shifts.reduce((t,s)=>t+s.rate*s.hours*slotsOf(s).filter(w=>w.status=="done").length,0);
 let h='<div class="stats">'+[["Pending users",pend],["Open shifts",openS],["Active",act],["Completed",done.length],["Users",users.length],["Worker pay",inr(paid)]].map(x=>`<div class="st"><b>${x[1]}</b><small>${x[0]}</small></div>`).join("")+'</div>';
 h+='<div class="f"><button data-t="users" class="'+(tab=="users"?"on":"")+'">Users</button><button data-t="shifts" class="'+(tab=="shifts"?"on":"")+'">Shifts</button><button id="out">Sign out</button></div>';
 if(err)h+='<p>'+esc(err)+'</p>';
 if(tab=="users"){
  const L=users.slice().sort((a,b)=>(a.status=="pending"?0:1)-(b.status=="pending"?0:1));
  h+=L.length?L.map(x=>`<div class="card ${x.status}"><b>${esc(x.name)}</b><span class="tag">${esc(x.role)}</span><span class="tag">${esc(x.status)}</span><br>${esc(x.email)}<br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a> · <a href="https://wa.me/91${esc(x.phone)}" target="_blank" rel="noopener">WhatsApp</a>
  <div class="a">${x.status!="approved"?`<button class="g" data-ap="${x.id}">Approve</button>`:""}${x.status!="blocked"?`<button class="r" data-bl="${x.id}">Block</button>`:""}<button data-du="${x.id}">Delete</button></div></div>`).join(""):'<div class="empty">No users yet.</div>'}
 else{
  h+='<div class="f">'+["all","open","full","done","cancelled"].map(k=>`<button data-f="${k}" class="${flt==k?"on":""}">${k}</button>`).join("")+'</div>';
  const L=shifts.filter(s=>flt=="all"||stat(s)==flt);
  h+=L.length?L.map(s=>`<div class="card ${stat(s)}"><b>${esc(s.venue)}</b><span class="tag">${esc(s.trade||"waiter")}</span><span class="tag">${NAMES[stat(s)]||esc(stat(s))}${s.needed?" "+slotsOf(s).length+"/"+s.needed:""}</span><br>${esc(s.date)}, ${esc(s.time)} \u00b7 ${s.hours} hrs \u00b7 ${inr(s.rate)}/hr = <b>${inr(s.rate*s.hours)}</b>${okMap(s.map)?`<br><a href="${esc(s.map)}" target="_blank" rel="noopener">Map</a>`:s.address?"<br>Address: "+esc(s.address):""}<br>Business: ${esc(s.ownerName||"-")}${slotsOf(s).length?"<br>Waiters: "+slotsOf(s).map(w=>esc(w.name)+" ("+esc(w.status)+", "+esc(w.pay||"cash")+(w.paid?", paid":"")+(w.received?", received":"")+")").join(", "):""}
  <div class="a">${stat(s)!="cancelled"&&stat(s)!="done"?`<button class="r" data-c="${s.id}">Cancel</button>`:""}${(s.status=="cancelled"||slotsOf(s).length)&&stat(s)!="done"?`<button data-o="${s.id}">Reset</button>`:""}<button data-d="${s.id}">Delete</button></div></div>`).join(""):'<div class="empty">Nothing here.</div>'}
 $("main").innerHTML=h}

function stop(){unsubs.forEach(f=>f());unsubs=[];users=[];shifts=[]}
onAuthStateChanged(auth,u=>{stop();err="";
 if(u&&(u.email||"").toLowerCase()===ADMIN){
  unsubs.push(onSnapshot(collection(db,"users"),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{err="Users: "+e.message;draw()}));
  unsubs.push(onSnapshot(query(collection(db,"shifts"),orderBy("created","desc")),s=>{shifts=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{err="Shifts: "+e.message;draw()}))}
 draw()});

document.addEventListener("click",async e=>{const t=e.target;if(t.tagName!=="BUTTON")return;
 try{
 if(t.id=="login"){const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(x){if(x.code=="auth/popup-blocked")await signInWithRedirect(auth,p);else if(x.code!="auth/popup-closed-by-user")throw x}}
 else if(t.id=="out")await signOut(auth);
 else if(t.dataset.t){tab=t.dataset.t;draw()}
 else if(t.dataset.f){flt=t.dataset.f;draw()}
 else if(t.dataset.ap)await updateDoc(doc(db,"users",t.dataset.ap),{status:"approved"});
 else if(t.dataset.bl){if(confirm("Block this user?"))await updateDoc(doc(db,"users",t.dataset.bl),{status:"blocked"})}
 else if(t.dataset.du){if(confirm("Delete this user profile?"))await deleteDoc(doc(db,"users",t.dataset.du))}
 else if(t.dataset.c){if(confirm("Cancel this shift?"))await updateDoc(doc(db,"shifts",t.dataset.c),{status:"cancelled"})}
 else if(t.dataset.o){if(confirm("Reset to an open shift? All waiters will be removed."))await updateDoc(doc(db,"shifts",t.dataset.o),{status:"open",slots:{}})}
 else if(t.dataset.d){if(confirm("Delete permanently?")){try{await deleteDoc(doc(db,"shifts",t.dataset.d,"secret","otp"))}catch(x){}await deleteDoc(doc(db,"shifts",t.dataset.d))}}
 }catch(x){err="Failed: "+x.message;draw()}});
</script></body></html>
