<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaamgar Pilot</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe4;--card:#fffdf7;--ink:#2b2420;--mut:#7a6d62;--brick:#b5452b;--turm:#e0a31b;--line:#d9cfbc;--ok:#3f7d4e}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#27211d;--ink:#f1e9da;--mut:#a89a8a;--brick:#e0674a;--turm:#e8b43a;--line:#41382f;--ok:#6bb57c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Mono",monospace}
.w{max-width:480px;margin:0 auto;padding:16px}h1{font-size:18px;margin:0}h1 span{color:var(--brick)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px dashed var(--line);border-left:5px solid var(--turm);padding:12px;margin:10px 0}
.card.done{border-left-color:var(--ok)}.card.cancelled{opacity:.6}
label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
input,select{width:100%;padding:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:10px;border:0;background:var(--brick);color:#fff;font:inherit;font-weight:600;margin-top:10px;width:100%}
.btn.alt{background:var(--ink);color:var(--bg)}.btn.sm{width:auto;padding:6px 10px;margin:0;font-size:12px}
.pick{display:flex;gap:8px;margin-top:6px}.pick button{flex:1;padding:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:600}
.pick button.on{background:var(--brick);border-color:var(--brick);color:#fff}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--ink);margin-left:6px}
.otp{font-size:26px;letter-spacing:6px;font-weight:600;color:var(--brick)}.big{font-size:20px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:24px 0}.err{color:var(--brick)}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>Kaamgar<span>.</span> Pilot</h1><span id="who"></span></div>
<div class="sub">Waiters &amp; helpers · Koramangala, Bengaluru</div>
<div id="app"><div class="empty">Loading…</div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,updateDoc,onSnapshot,query,where,orderBy,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAhlOUnba7MfRQIFlif60qsUkkZHnQS6Rc",authDomain:"kaamon-pilot.firebaseapp.com",projectId:"kaamon-pilot",storageBucket:"kaamon-pilot.firebasestorage.app",messagingSenderId:"463694330185",appId:"1:463694330185:web:2a445f304195f4cd8f4298"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const NAMES={open:"OPEN",full:"FULL",done:"COMPLETED",cancelled:"CANCELLED"};
const TRADE={waiter:"Waiter",helper:"General helper"};
const W={accepted:"ACCEPTED",started:"IN PROGRESS",done:"COMPLETED"};
const slotsOf=s=>Object.entries(s.slots||{}).map(([uid,v])=>({uid,...v}));
function stat(s){if(s.status=="cancelled")return "cancelled";const L=slotsOf(s);if(L.length&&L.filter(w=>w.status=="done").length>=s.needed)return "done";if(L.length>=s.needed)return "full";return "open"}

let user=null,prof=undefined,shifts=[],otps={},contacts={},unProf=null,unShifts=null,pickRole="waiter",msg="";

function extra(s){return (s.address?`<br>Address: ${esc(s.address)}`:"")+(s.dress?`<br>Dress code: ${esc(s.dress)}`:"")+(s.notes?`<br>Note: ${esc(s.notes)}`:"")}
function head(s){return `<b>${esc(s.venue)}</b><span class="tag">${NAMES[stat(s)]} ${slotsOf(s).length}/${s.needed}</span><br>${TRADE[s.trade||"waiter"]} · ${esc(s.date)}, ${esc(s.time)} · ${s.hours} hrs · ${inr(s.rate)}/hr${extra(s)}<br><span class="big">${inr(s.rate*s.hours)}</span> per waiter`}

function viewLogin(){return `<div class="card"><b>Welcome</b><p>Sign in with your Google account to continue.</p><button class="btn" id="login">Sign in with Google</button><div class="err" id="m">${esc(msg)}</div></div>`}

function viewRegister(){return `<div class="card"><b>Create your profile</b>
<label>I am a</label><div class="pick"><button data-pick="business" class="${pickRole=="business"?"on":""}">Business</button><button data-pick="waiter" class="${pickRole=="waiter"?"on":""}">Waiter</button><button data-pick="helper" class="${pickRole=="helper"?"on":""}">General helper</button></div>
<label>${pickRole=="business"?"Business / venue name":"Your full name"}</label><input id="nm" value="">
<label>Mobile number (10 digits)</label><input id="ph" inputmode="numeric" maxlength="10">
<button class="btn" id="reg">Submit for approval</button><div class="err" id="m">${esc(msg)}</div></div>`}

function viewPending(){return `<div class="card"><b>Waiting for approval</b><p>Thanks, ${esc(prof.name)}. We will call or WhatsApp ${esc(prof.phone)} to verify you. Once approved, reopen this page.</p></div>`}
function viewBlocked(){return `<div class="card"><b>Account not active</b><p>Please contact the Kaamgar team.</p></div>`}

function viewB(){
 let h=`<div class="card"><b>Post a shift</b><label>Venue</label><input id="v" placeholder="e.g. Third Wave Coffee, 5th Block">
 <div class="row"><div><label>Day</label><input id="d" placeholder="Sat"></div><div><label>Start</label><input id="t" placeholder="7:00 PM"></div></div>
 <label>Worker needed</label><select id="tr"><option value="waiter">Waiter</option><option value="helper">General helper</option></select>
 <div class="row"><div><label>Hours</label><input id="h" type="number" value="5"></div><div><label>₹/hr</label><input id="r" type="number" value="200"></div><div><label>Workers</label><input id="nd" type="number" min="1" max="20" value="1"></div></div>
 <label>Address / location</label><input id="ad" placeholder="Street, area, landmark">
 <label>Dress code</label><input id="dc" placeholder="e.g. black shirt, black pants">
 <label>Notes for waiter</label><input id="nt" placeholder="e.g. Report to manager Suresh">
 <label>Contact number for this shift</label><input id="cp" inputmode="numeric" maxlength="10" value="${esc(prof.phone)}">
 <button class="btn" id="post">Post shift</button><div class="err" id="m">${esc(msg)}</div></div><b>Your shifts</b>`;
 if(!shifts.length)h+='<div class="empty">No shifts yet.</div>';
 shifts.forEach(s=>{h+=`<div class="card ${stat(s)}">${head(s)}`;
  h+=`<br>Total for ${s.needed}: <b>${inr(s.rate*s.hours*s.needed)}</b>`;
  const L=slotsOf(s);
  L.forEach(w=>{h+=`<br>${esc(w.name)} <span class="tag">${W[w.status]||""}</span>`+(w.status=="started"?` <button class="btn sm alt" data-end="${s.id}|${w.uid}">Confirm finished</button>`:"")});
  if(L.some(w=>w.status=="accepted"))h+=`<div>Share this OTP with waiters on arrival:</div><div class="otp">${esc(otps[s.id]||"…")}</div>`;
  h+="</div>"});return h}

function viewW(){
 const open=shifts.filter(s=>stat(s)=="open"&&(s.trade||"waiter")==prof.role&&!(s.slots||{})[user.uid]),mine=shifts.filter(s=>(s.slots||{})[user.uid]);
 let h="<p><b>Open shifts nearby</b></p>";
 if(!open.length)h+='<div class="empty">No open shifts right now.</div>';
 open.forEach(s=>h+=`<div class="card">${head(s)}<br>By ${esc(s.ownerName||"")} · ${s.needed-slotsOf(s).length} spot(s) left<button class="btn" data-acc="${s.id}">Accept shift</button></div>`);
 h+="<p><b>My shifts</b></p>";
 if(!mine.length)h+='<div class="empty">Nothing accepted yet.</div>';
 mine.forEach(s=>{const my=s.slots[user.uid];h+=`<div class="card ${my.status=="done"?"done":""}">${head(s)}${contacts[s.id]?`<br>Contact: <a href="tel:${esc(contacts[s.id])}">${esc(contacts[s.id])}</a>`:""}`;
  if(s.status=="cancelled")h+="<br><b>This shift was cancelled.</b>";
  else if(my.status=="accepted")h+=`<label>Enter OTP from the business</label><input id="o${s.id}" inputmode="numeric" maxlength="4"><button class="btn" data-go="${s.id}">Start shift</button><div class="err" id="e${s.id}"></div>`;
  else if(my.status=="started")h+="<div>Shift running.</div>";
  else if(my.status=="done")h+=`<div>Job ticket #${s.id.slice(0,5).toUpperCase()} · You earn <b>${inr(s.rate*s.hours)}</b></div>`;
  h+="</div>"});
 return h+`<div class="err">${esc(msg)}</div>`}

function draw(){
 if(document.activeElement&&document.activeElement.tagName=="INPUT")return;
 $("who").innerHTML=user?`<button class="btn sm alt" id="out">Sign out</button>`:"";
 let h;
 if(!user)h=viewLogin();
 else if(prof===undefined)h='<div class="empty">Loading…</div>';
 else if(prof===null)h=viewRegister();
 else if(prof.status=="pending")h=viewPending();
 else if(prof.status!="approved")h=viewBlocked();
 else h=prof.role=="business"?viewB():viewW();
 $("app").innerHTML=h}

function stop(){if(unProf)unProf();if(unShifts)unShifts();unProf=unShifts=null;shifts=[];otps={};contacts={}}
function subShifts(){
 if(unShifts)return;
 const q=prof.role=="business"?query(collection(db,"shifts"),where("owner","==",user.uid)):query(collection(db,"shifts"),orderBy("created","desc"));
 unShifts=onSnapshot(q,snap=>{
  shifts=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.needed);
  if(prof.role=="business"){
   shifts.sort((a,b)=>(b.created?b.created.seconds:9e12)-(a.created?a.created.seconds:9e12));
   shifts.filter(s=>slotsOf(s).some(w=>w.status=="accepted")&&!otps[s.id]).forEach(async s=>{
    try{const o=await getDoc(doc(db,"shifts",s.id,"secret","otp"));if(o.exists()){otps[s.id]=o.data().code;draw()}}catch(e){}})}
  if(prof.role!="business"){
   shifts.filter(s=>s.slots&&s.slots[user.uid]&&(s.slots[user.uid].status=="accepted"||s.slots[user.uid].status=="started")&&!contacts[s.id]).forEach(async s=>{
    try{const o=await getDoc(doc(db,"shifts",s.id,"secret","contact"));if(o.exists()){contacts[s.id]=o.data().phone;draw()}}catch(e){}})}
  draw()},err=>{msg="Could not load shifts: "+err.message;draw()})}

onAuthStateChanged(auth,u=>{
 stop();user=u;prof=undefined;
 if(!u){draw();return}
 unProf=onSnapshot(doc(db,"users",u.uid),s=>{prof=s.exists()?s.data():null;if(prof&&prof.status=="approved")subShifts();draw()},
  err=>{$("app").innerHTML='<div class="empty err">Error: '+esc(err.message)+'</div>'});
 draw()});

document.addEventListener("click",async e=>{
 const t=e.target;if(t.tagName!=="BUTTON")return;msg="";
 try{
 if(t.id=="login"){const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}catch(err){if(err.code=="auth/popup-blocked"||err.code=="auth/operation-not-supported-in-this-environment")await signInWithRedirect(auth,p);else if(err.code!="auth/popup-closed-by-user"&&err.code!="auth/cancelled-popup-request")throw err}}
 else if(t.id=="out"){await signOut(auth)}
 else if(t.dataset.pick){pickRole=t.dataset.pick;const n=$("nm").value,p=$("ph").value;document.activeElement.blur();draw();$("nm").value=n;$("ph").value=p;return}
 else if(t.id=="reg"){const nm=$("nm").value.trim(),ph=$("ph").value.trim();
  if(nm.length<2||!/^[6-9]\d{9}$/.test(ph)){msg="Enter a valid name and 10-digit mobile number.";$("m").textContent=msg;return}
  await setDoc(doc(db,"users",user.uid),{name:nm,phone:ph,role:pickRole,status:"pending",email:user.email||"",created:serverTimestamp()})}
 else if(t.id=="post"){const v=$("v").value.trim(),d=$("d").value.trim(),tm=$("t").value.trim(),hr=+$("h").value,rt=+$("r").value,nd=Math.floor(+$("nd").value),tr=$("tr").value,ad=$("ad").value.trim(),dc=$("dc").value.trim(),nt=$("nt").value.trim(),cp=$("cp").value.trim();
  if(!v||!d||!tm||!ad||!(hr>0)||!(rt>0)){$("m").textContent="Please fill venue, day, start, hours, rate and address.";return}
  if(!(nd>=1&&nd<=20)){$("m").textContent="Workers needed must be between 1 and 20.";return}
  if(!/^[6-9]\d{9}$/.test(cp)){$("m").textContent="Enter a valid 10-digit contact number.";return}
  const ref=doc(collection(db,"shifts")),b=writeBatch(db);
  b.set(ref,{venue:v,date:d,time:tm,hours:hr,rate:rt,address:ad,dress:dc,notes:nt,trade:tr,needed:nd,slots:{},status:"open",owner:user.uid,ownerName:prof.name,created:serverTimestamp()});
  b.set(doc(db,"shifts",ref.id,"secret","otp"),{code:String(1000+Math.floor(Math.random()*9000))});
  b.set(doc(db,"shifts",ref.id,"secret","contact"),{phone:cp});
  await b.commit()}
 else if(t.dataset.acc){try{await updateDoc(doc(db,"shifts",t.dataset.acc),{["slots."+user.uid]:{name:prof.name,status:"accepted"}})}catch(err){msg="Could not accept. The shift may just have been filled.";draw();return}}
 else if(t.dataset.go){const id=t.dataset.go,v=$("o"+id).value.trim();
  try{await updateDoc(doc(db,"shifts",id),{["slots."+user.uid+".status"]:"started",["slots."+user.uid+".otpTry"]:v})}catch(err){$("e"+id).textContent="Wrong OTP. Ask the business again.";return}}
 else if(t.dataset.end){const p=t.dataset.end.split("|");await updateDoc(doc(db,"shifts",p[0]),{["slots."+p[1]+".status"]:"done"})}
 else return;
 }catch(err){msg="Could not save: "+err.message;const m=$("m");if(m)m.textContent=msg}
 document.activeElement.blur();draw()});
</script>
</body>
</html>
